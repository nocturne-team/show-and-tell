version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v6+ moves caching into a proprietary component under Gradle's commercial terms; v5 is MIT
      - dependency-name: "gradle/actions"
        versions: [">=6"]
