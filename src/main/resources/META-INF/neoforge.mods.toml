license = "CC0-1.0"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "0x00ACAB"
description = "Show off items, inventories and ender chests in chat with a click-to-inspect preview."

logoFile = "assets/showandtell/icon.png"

[[mixins]]
config = "showandtell.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
